name: rootless-safe-demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Rootless UIKit Demo Build
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip
          mv theos-sdks-master/*.sdk "$THEOS/sdks/"
          rm -rf theos-sdks-master sdks.zip
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Create SafeDemo project
        run: |
          mkdir -p SafeDemo

          cat > SafeDemo/Makefile | tee SafeDemo/Makefile
          TARGET iphone:clang:latest:15.0
