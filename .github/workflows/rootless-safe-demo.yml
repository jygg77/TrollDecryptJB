name: rootless-safe-demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/rootless-ci-no-heredoc

permissions:
  contents: read

jobs:
  build:
    name: Rootless UIKit Demo Build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and dependencies
        run: |
          set -euo pipefail
          brew install ldid make fakeroot dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 https://github.com/theos/sdks/archive/refs/heads/master.zip -o "$RUNNER_TEMP/theos-sdks.zip"
          unzip -q "$RUNNER_TEMP/theos-sdks.zip" -d "$THEOS/sdks"
          for sdk in "$THEOS"/sdks/sdks-master/*.sdk; do
            if [ -d "$sdk" ]; then
              mv "$sdk" "$THEOS/sdks/"
            fi
          done
          rm -rf "$THEOS/sdks/sdks-master" "$RUNNER_TEMP/theos-sdks.zip"
          if ! find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit | grep -q .; then
            echo "No iOS SDK was installed in $THEOS/sdks" >&2
            exit 1
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_ROOT=$THEOS"
          find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print

      - name: Generate and validate independent SafeDemo project
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/create_safedemo.py
          python3 scripts/create_safedemo.py
          test -f SafeDemo/Makefile
          test -f SafeDemo/control
          test -f SafeDemo/Info.plist
          test -f SafeDemo/ViewController.m
          plutil -lint SafeDemo/Info.plist
          grep -q '^TARGET = iphone:clang:latest:15.0$' SafeDemo/Makefile
          grep -q '^THEOS_PACKAGE_SCHEME = rootless$' SafeDemo/Makefile
          grep -q '^ARCHS = arm64$' SafeDemo/Makefile
          echo "Independent SafeDemo project validated."

      - name: Build rootless DEB
        working-directory: SafeDemo
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/build-evidence"
          make clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/safedemo-build.log"
          cp "$RUNNER_TEMP/safedemo-build.log" "$GITHUB_WORKSPACE/build-evidence/build.log"
          DEB="$(find packages -maxdepth 1 -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "No iphoneos-arm64 DEB found after build."
            find packages -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$DEB" "$GITHUB_WORKSPACE/build-evidence/"
          printf 'DEB_SOURCE=%s\n' "$DEB" | tee "$GITHUB_WORKSPACE/build-evidence/deb-path.txt"
          ls -l "$DEB" "$GITHUB_WORKSPACE/build-evidence/"

      - name: Inspect and verify package
        working-directory: SafeDemo
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::VERIFY_FAILURE line=$LINENO command=$BASH_COMMAND exit=$rc"; exit "$rc"' ERR
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/build-evidence"

          echo "CHECKPOINT 1: locate rootless DEB"
          DEB="$(find packages -maxdepth 1 -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "::error::No iphoneos-arm64 package found in SafeDemo/packages"
            find packages -maxdepth 3 -print
            exit 1
          fi
          echo "PACKAGE_PATH=$DEB"
          ls -l "$DEB"

          echo "CHECKPOINT 2: inspect Debian control metadata"
          dpkg-deb --info "$DEB" 2>&1 | tee "$GITHUB_WORKSPACE/build-evidence/deb-info.txt"
          PACKAGE_ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          PACKAGE_VERSION="$(dpkg-deb -f "$DEB" Version)"
          echo "PACKAGE_ARCH=$PACKAGE_ARCH"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          test "$PACKAGE_ARCH" = "iphoneos-arm64"
          test "$PACKAGE_VERSION" = "0.1.0"

          echo "CHECKPOINT 3: list archive entries"
          dpkg-deb --contents "$DEB" 2>&1 | tee "$GITHUB_WORKSPACE/build-evidence/deb-contents.txt"

          echo "CHECKPOINT 4: extract package"
          EXTRACT="$RUNNER_TEMP/safedemo-deb"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          dpkg-deb --extract "$DEB" "$EXTRACT"
          find "$EXTRACT" -maxdepth 7 -print | tee "$GITHUB_WORKSPACE/build-evidence/extracted-tree.txt"

          echo "CHECKPOINT 5: verify rootless application location"
          APP="$EXTRACT/var/jb/Applications/TrollDecryptAuditDemo.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected rootless app directory not found: $APP"
            echo "Extracted package tree follows:"
            find "$EXTRACT" -maxdepth 10 -print
            exit 1
          fi

          echo "CHECKPOINT 6: verify executable and Info.plist"
          BIN="$APP/TrollDecryptAuditDemo"
          test -s "$BIN"
          test -s "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          python3 -c 'import plistlib,sys; info=plistlib.load(open(sys.argv[1], "rb")); assert info.get("CFBundleIdentifier") == "com.jygg77.trolldecrypt-audit-demo", info; assert info.get("CFBundleShortVersionString") == "0.1.0", info; assert info.get("CFBundleExecutable") == "TrollDecryptAuditDemo", info; print("BUNDLE_ID=" + info["CFBundleIdentifier"]); print("BUNDLE_VERSION=" + info["CFBundleShortVersionString"])' "$APP/Info.plist"

          echo "CHECKPOINT 7: verify executable architecture"
          lipo -info "$BIN" | tee "$GITHUB_WORKSPACE/build-evidence/binary-architecture.txt"
          lipo -verify_arch arm64 "$BIN"
          ARCHS_FOUND="$(lipo -archs "$BIN")"
          echo "BINARY_ARCHS=$ARCHS_FOUND"

          echo "CHECKPOINT 8: scan package for excluded helpers and libraries"
          find "$EXTRACT" -type f \( -name '*.dylib' -o -name '*.so' -o -name 'flexdecrypt*' -o -name 'dlopentool*' -o -name '*DumpDecrypted*' -o -name '*TweakHook*' -o -name '*daemonKiller*' \) -print > "$GITHUB_WORKSPACE/build-evidence/forbidden-files.txt"
          if [ -s "$GITHUB_WORKSPACE/build-evidence/forbidden-files.txt" ]; then
            cat "$GITHUB_WORKSPACE/build-evidence/forbidden-files.txt"
            echo "::error::Unexpected helper/library payload found."
            exit 1
          fi

          echo "CHECKPOINT 9: scan binary strings for excluded functionality markers"
          strings "$BIN" > "$RUNNER_TEMP/safedemo-strings.txt"
          if grep -Eiq 'flexdecrypt|dlopentool|TDDumpDecrypted|TweakHook|appstoretrollerKiller|mach_vm_read|task_for_pid|ptrace' "$RUNNER_TEMP/safedemo-strings.txt"; then
            echo "::error::Forbidden functionality marker found in the demo executable."
            grep -Ein 'flexdecrypt|dlopentool|TDDumpDecrypted|TweakHook|appstoretrollerKiller|mach_vm_read|task_for_pid|ptrace' "$RUNNER_TEMP/safedemo-strings.txt" || true
            exit 1
          fi

          {
            echo "RESULT=PASS"
            echo "PACKAGE=$(basename "$DEB")"
            echo "PACKAGE_ARCH=$PACKAGE_ARCH"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "BINARY_ARCHS=$ARCHS_FOUND"
            echo "APP_PATH=/var/jb/Applications/TrollDecryptAuditDemo.app"
            echo "BUNDLE_ID=com.jygg77.trolldecrypt-audit-demo"
            echo "BUNDLE_VERSION=0.1.0"
            echo "CHECKS=DEB metadata; archive entries; rootless install path; Info.plist; arm64 executable; excluded payload and marker scans"
          } | tee "$GITHUB_WORKSPACE/build-evidence/evidence.txt"

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecryptAuditDemo-rootless-diagnostics
          path: build-evidence/*
          if-no-files-found: warn
          retention-days: 14
